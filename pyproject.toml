[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bomi"
version = "0.1.0"
description = "Board mining tools for board-based collaborative work management event logs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Board Miner contributors" }
]
keywords = [
  "board mining",
  "process mining",
  "Trello",
  "collaborative work management",
  "event logs"
]
dependencies = [
  "matplotlib",
  "networkx",
  "numpy",
  "pandas",
  "requests",
  "seaborn"
]

[project.optional-dependencies]
process = ["pm4py"]
dashboard = ["fastapi>=0.111", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "requests-oauthlib>=1.3"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
bomi-dashboard = "bomi.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bomi.dashboard" = ["server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
asyncio_mode = "auto"
